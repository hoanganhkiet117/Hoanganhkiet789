<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#070914">
  <title>HOANG ANH KIET — Tài Xỉu 3D Demo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="bg-orb orb1"></div><div class="bg-orb orb2"></div>
  <header class="topbar glass">
    <div class="brand"><span class="crown">♛</span><div><b>HOANG ANH KIET</b><small>3D DICE • DEMO</small></div></div>
    <div class="balance"><span>Điểm ảo</span><strong id="balance">10,000</strong></div>
    <button class="icon-btn" id="soundBtn" aria-label="Âm thanh">🔊</button>
  </header>

  <main class="stage">
    <section class="hero glass">
      <div class="hero-copy">
        <span class="badge">🎮 CHẾ ĐỘ GIẢI TRÍ</span>
        <h1>TÀI <em>•</em> XỈU</h1>
        <p>Game mô phỏng bằng <b>điểm ảo</b>. Không nạp/rút tiền thật.</p>
      </div>
      <div class="dice-table">
        <div class="neon-ring"></div>
        <div class="dice-row" id="diceRow">
          <div class="die">⚄</div><div class="die">⚂</div><div class="die">⚅</div>
        </div>
        <div class="result" id="result">Sẵn sàng</div>
      </div>
    </section>

    <section class="controls">
      <div class="bet glass">
        <div class="section-title"><span>🎯 Chọn cửa</span><span id="betText">Cược 500 điểm</span></div>
        <div class="choices">
          <button class="choice tai active" data-side="TÀI">TÀI <small>11–17</small></button>
          <button class="choice xiu" data-side="XỈU">XỈU <small>4–10</small></button>
        </div>
        <div class="chips">
          <button data-amount="100">100</button><button data-amount="500" class="selected">500</button>
          <button data-amount="1000">1K</button><button data-amount="5000">5K</button>
        </div>
        <button class="roll" id="rollBtn">🎲 LẮC XÚC XẮC</button>
      </div>

      <aside class="side glass">
        <div class="mini-title">VÍ ĐIỂM ẢO</div>
        <div class="wallet"><span>🪙</span><strong id="wallet">10,000</strong></div>
        <div class="wallet-actions">
          <button id="depositBtn">＋ Nạp điểm</button>
          <button id="withdrawBtn">↗ Rút điểm</button>
        </div>
        <button class="login" id="loginBtn">👤 Đăng nhập / Đăng ký</button>
      </aside>
    </section>
  </main>

  <footer>HOANG ANH KIET • 3D DEMO • Điểm chỉ mang tính mô phỏng</footer>

  <div class="modal hidden" id="modal">
    <div class="modal-card glass">
      <button class="close" id="closeModal">×</button>
      <div id="modalContent"></div>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
